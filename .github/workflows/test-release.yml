name: Test automated release v2

on:
  schedule:
    - cron: "45-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release tag
        id: tag
        run: |
          TAG="test-$(date -u +'%Y-%m-%d-%H%M')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Test release ${{ steps.tag.outputs.tag }}"
          body: |
            Automated test release created every 15 minutes.
            This release is for workflow testing only and is not connected to Zenodo.
          prerelease: false
          draft: false
